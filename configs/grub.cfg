# =========================================================
# PRELOOP UTILITIES - PROFESSIONAL IT-TOOLKIT
# FINAL REPAIR VERSION (FIXED THEME & GRAPHICS INITIALIZATION)
# =========================================================

# ---------------------------------------------------------
# BASIC & HYBRID SETTINGS
# ---------------------------------------------------------
set timeout=20
set default=0

# Automatische Erkennung des Boot-Modus (UEFI vs. BIOS)
if [ "${grub_platform}" = "efi" ]; then
    set mode_info="[UEFI Mode]"
else
    set mode_info="[Legacy BIOS Mode]"
fi

# Multi-Boot USB: Automatisches Finden des Mediums
search --no-floppy --file --set=root /boot/grub/grub.cfg
set prefix=($root)/boot/grub

# ---------------------------------------------------------
# CORE MODULES & DRIVERS (Zwingend erforderlich)
# ---------------------------------------------------------
insmod part_gpt
insmod part_msdos
insmod fat
insmod ntfs
insmod exfat
insmod ext2
insmod loopback
insmod test

# Befehle für ältere BIOS-Boot-Einträge laden
if [ "${grub_platform}" = "pc" ]; then
    insmod linux16
fi

# Netzwerk-Module für PXE-Boot
insmod net
insmod efinet
insmod tftp
insmod http

# ---------------------------------------------------------
# GRAFIK & UI INITIALISIEREN (Optimierte Boot-Reihenfolge)
# ---------------------------------------------------------
# 1. Alle Videotreiber & PNG-Support laden
insmod all_video
insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus
insmod png

# 2. Grafikmodus festlegen (Passend zu modernen Bildschirmen)
set gfxmode=1920x1080,1366x768,1024x768,auto
set gfxpayload=keep

# 3. Grafikterminal & Theme-Module aktivieren
insmod gfxterm
insmod gfxmenu

# 4. Standard-Schriftart laden (Überlebenswichtig für das Theme!)
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    terminal_output gfxterm
fi

# 5. Theme injizieren (Das Hintergrundbild wird über die theme.txt gesteuert)
if [ -f /boot/grub/themes/preloop/theme.txt ]; then
    set theme=/boot/grub/themes/preloop/theme.txt
    export theme
else
    # Fallback: Falls das Theme crasht, lade wenigstens das nackte Bild
    if [ -f /boot/grub/themes/preloop/background.png ]; then
        background_image /boot/grub/themes/preloop/background.png
    fi
fi

# =========================================================
# MAIN MENU - OPERATING SYSTEMS & RECOVERY
# =========================================================

# 1. WINDOWS STARTEN
menuentry "Windows Boot Manager / Local OS ${mode_info}" --class windows --class os {
    if [ "${grub_platform}" = "efi" ]; then
        search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
        chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    else
        search --no-floppy --file --set=root /bootmgr
        chainloader +1
    fi
}

# 2. INSTALLIERTES LINUX STARTEN
menuentry "Aninstalliertes Linux System suchen" --class linux {
    echo "Suche nach installierten Linux-Systemen..."
    insmod normal
    search --no-floppy --file --set=root /vmlinuz
    if [ -f /boot/grub/grub.cfg ]; then
        configfile /boot/grub/grub.cfg
    elif [ -f /grub/grub.cfg ]; then
        configfile /grub/grub.cfg
    else
        echo "Kein installiertes Linux GRUB-Menü direkt gefunden."
        sleep 3
    fi
}

# =========================================================
# MULTI-BOOT ISO RECOVERY TOOLS
# =========================================================

# 3. LINUX & WLAN-DIAGNOSE (Ubuntu Live)
menuentry "Ubuntu Live ISO (WLAN & Netzwerk)" --class ubuntu {
    set isofile="/ISO/ubuntu.iso"
    search --no-floppy --file --set=root $isofile
    loopback loop $isofile
    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile quiet splash noeject --
    initrd (loop)/casper/initrd
}

# 4. RECOVERY BOOT (SystemRescue)
menuentry "SystemRescue ISO (Systemrettung)" --class recovery {
    set isofile="/ISO/systemrescue.iso"
    search --no-floppy --file --set=root $isofile
    loopback loop $isofile
    linux (loop)/boot/x86_64/vmlinuz img_dev=/dev/disk/by-label/PRELOOP img_loop=$isofile archisobasedir=boot earlymodules=loop quiet
    initrd (loop)/boot/intel_ucode.img (loop)/boot/amd_ucode.img (loop)/boot/x86_64/sysresccd.img
}

# 5. SSD & FESTPLATTEN TEST (GParted)
menuentry "GParted Live & SSD/HDD Tools" --class gparted {
    set isofile="/ISO/gparted.iso"
    search --no-floppy --file --set=root $isofile
    loopback loop $isofile
    linux (loop)/live/vmlinuz boot=live config union=overlay username=user components noswap noeject findiso=$isofile
    initrd (loop)/live/initrd.img
}

# =========================================================
# DIAGNOSTICS & HARDWARE TOOLKIT
# =========================================================

# 6. RAM TESTEN
menuentry "Memory Test (MemTest86+)" --class memtest {
    if [ "${grub_platform}" = "efi" ]; then
        search --no-floppy --file --set=root /boot/grub/memtest86.efi
        chainloader /boot/grub/memtest86.efi
    else
        search --no-floppy --file --set=root /boot/grub/memtest86+.bin
        linux16 /boot/grub/memtest86+.bin
    fi
}

# 7. PXE NETZWERKBOOT
menuentry "PXE Netzwerkboot (iPXE)" --class network {
    echo "Initialisiere Netzwerk-Schnittstellen..."
    net_dhcp
    echo "Lade iPXE Netzwerk-Umgebung..."
    if [ "${grub_platform}" = "efi" ]; then
        search --no-floppy --file --set=root /boot/netboot/netboot.xyz.efi
        chainloader /boot/netboot/netboot.xyz.efi
    else
        search --no-floppy --file --set=root /boot/netboot/netboot.xyz.lkrn
        linux16 /boot/netboot/netboot.xyz.lkrn
    fi
}

# =========================================================
# SUBMENUS
# =========================================================
submenu "Hersteller-Tools & Diagnose" --class tools {
    menuentry "Seatools (Seagate/HDD Diagnose)" {
        set isofile="/ISO/seatools.iso"
        search --no-floppy --file --set=root $isofile
        loopback loop $isofile
        linux (loop)/live/vmlinuz boot=live findiso=$isofile quiet
        initrd (loop)/live/initrd.img
    }
}

submenu "Erweiterte IT-Werkzeuge" --class settings {
    menuentry "EFI Shell starten" {
        if [ "${grub_platform}" = "efi" ]; then
            search --no-floppy --file --set=root /EFI/tools/shellx64.efi
            chainloader /EFI/tools/shellx64.efi
        else
            echo "Fehler: EFI Shell im Legacy BIOS Modus nicht verfügbar!"
            sleep 4
        fi
    }

    menuentry "BIOS / UEFI Firmware öffnen" {
        if [ "${grub_platform}" = "efi" ]; then
            fwsetup
        else
            echo "Im Legacy BIOS Modus nicht unterstützt."
            sleep 4
        fi
    }

    menuentry "System Neustarten" { reboot }
    menuentry "System Ausschalten" { halt }
}
